<aside class="auth-side">
  <span class="blob" style="width:380px;height:380px;right:-120px;top:-120px;background:rgba(155,232,9,.28)"></span>
  <span class="blob" style="width:260px;height:260px;left:-80px;bottom:-60px;background:rgba(255,255,255,.07)"></span>
  <a class="logo" href="{{ url_for('public.home') }}" style="color:#fff!important;position:relative"><span class="logo-mark" style="background:var(--lime);color:var(--forest)">{{ icon('heart', 19) }}</span>DEMEU</a>
  <div style="position:relative">
    <h2>{{ _('auth_side_title') }}</h2>
    <p>{{ _('auth_side_text') }}</p>
    <div class="grid mt-3" style="gap:12px">
      {% for ic, k in [('search','auth_point_1'),('clock','auth_point_2'),('award','auth_point_3')] %}
      <div class="row" style="flex-wrap:nowrap"><span class="ic-wrap" style="width:38px;height:38px;border-radius:12px;background:rgba(155,232,9,.16);color:var(--lime);display:grid;place-items:center;flex:none">{{ icon(ic) }}</span><span>{{ _(k) }}</span></div>
      {% endfor %}
    </div>
  </div>
  <p class="xs" style="position:relative;margin:0">© 2026 DEMEU</p>
</aside>
